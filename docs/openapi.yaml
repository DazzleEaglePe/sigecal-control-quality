openapi: 3.1.0
info:
  title: SIGECAL API
  version: 0.1.0
  description: Contrato ejecutable del Sistema de Gestión de Control de Calidad.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
tags:
  - name: Estado
    description: Disponibilidad de la API y sus dependencias.
  - name: Autenticación
    description: Inicio, renovación y cierre seguro de sesión.
  - name: Usuarios
    description: Administración de cuentas y roles.
  - name: Maestros
    description: Catálogos configurables del sistema.
  - name: Lotes
    description: Ciclo de vida y trazabilidad de lotes productivos.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Comprueba la API y la conexión con PostgreSQL
      tags:
        - Estado
      responses:
        '200':
          description: La API y PostgreSQL están disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
                  database: connected
                  timestamp: 2026-09-01T15:00:00.000Z
        '503':
          description: PostgreSQL no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseUnavailableErrorResponse'
              example:
                success: false
                error:
                  code: DATABASE_UNAVAILABLE
                  message: El servicio no está disponible temporalmente.
                  details: []
  /auth/login:
    post:
      operationId: login
      summary: Inicia sesión y establece la cookie de refresco
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '423':
          description: Cuenta bloqueada temporalmente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Demasiados intentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rota el token de refresco y renueva el acceso
      tags:
        - Autenticación
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Token renovado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Token de refresco inválido o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoca el token de refresco y limpia la cookie
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          description: La sesión no es válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/me:
    get:
      operationId: getCurrentSession
      summary: Devuelve el usuario y sus permisos efectivos
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: La sesión no es válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password:
    patch:
      operationId: changeOwnPassword
      summary: Cambia la contraseña del usuario actual
      tags:
        - Autenticación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada y sesiones revocadas.
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: La sesión o contraseña actual no es válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /users:
    get:
      security: &a1
        - bearerAuth: []
      operationId: listUsers
      summary: Lista usuarios con filtros y paginación
      tags:
        - Usuarios
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: role
          in: query
          schema:
            type: string
            enum:
              - ADMIN
              - JEFE_CALIDAD
              - ANALISTA
              - OPERARIO
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Usuarios paginados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Sesión inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Acceso exclusivo de ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      security: *a1
      operationId: createUser
      summary: Crea un usuario con contraseña provisional
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Sesión inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Acceso exclusivo de ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Correo o área no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /users/{id}:
    get:
      security: *a1
      operationId: getUser
      summary: Obtiene el detalle de un usuario
      tags:
        - Usuarios
      parameters:
        - &a2
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Usuario inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      security: *a1
      operationId: updateUser
      summary: Actualiza datos y rol de un usuario
      tags:
        - Usuarios
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Usuario inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Correo o área no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /users/{id}/status:
    patch:
      security: *a1
      operationId: setUserStatus
      summary: Activa o desactiva un usuario sin eliminarlo
      tags:
        - Usuarios
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Estado actualizado y sesiones revocadas al desactivar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: No se permite la autodesactivación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /users/{id}/reset-password:
    post:
      security: *a1
      operationId: resetUserPassword
      summary: Asigna una contraseña provisional y revoca sesiones
      tags:
        - Usuarios
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '204':
          description: Contraseña restablecida.
        '404':
          description: Usuario inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/areas:
    get:
      security: *a1
      operationId: listAreas
      summary: Lista el catálogo mínimo de áreas
      tags:
        - Maestros
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Áreas disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaListResponse'
    post:
      security: *a1
      operationId: createArea
      summary: Crea un área organizacional
      tags:
        - Maestros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaRequest'
      responses:
        '201':
          description: Área creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '403':
          description: Requiere ADMIN o JEFE_CALIDAD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/areas/{id}:
    patch:
      security: *a1
      operationId: updateArea
      summary: Actualiza o desactiva un área
      tags:
        - Maestros
      parameters:
        - *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAreaRequest'
      responses:
        '200':
          description: Área actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaResponse'
        '404':
          description: Área inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Área en uso o código duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/standards:
    get:
      security: &a3
        - bearerAuth: []
      operationId: listStandards
      summary: Lista el historial de estándares de un parámetro
      tags:
        - Maestros
      parameters:
        - name: parameterId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Historial completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardListResponse'
    post:
      security: *a3
      operationId: createStandardVersion
      summary: Crea una versión y cierra la anterior del mismo ámbito
      tags:
        - Maestros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStandardRequest'
      responses:
        '201':
          description: Versión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Límites o fechas inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Requiere ADMIN o JEFE_CALIDAD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Intervalo de vigencia superpuesto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/standards/{id}:
    patch:
      security: *a3
      operationId: updateUnusedStandard
      summary: Actualiza un estándar que aún no fue aplicado
      tags:
        - Maestros
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStandardRequest'
      responses:
        '200':
          description: Estándar actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Estándar inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Estándar aplicado o límites resultantes inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/standards/effective:
    get:
      security: *a3
      operationId: resolveEffectiveStandard
      summary: Resuelve por fecha y prioridad de ámbito
      tags:
        - Maestros
      parameters:
        - name: parameterId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: piscoTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - &a4
          name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - &a5
          name: dataOrigin
          in: query
          schema:
            type: string
            enum:
              - REAL
              - DEMO
            default: REAL
      responses:
        '200':
          description: Estándar aplicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '422':
          description: No existe un estándar confirmado aplicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/sensory-thresholds:
    get:
      security: *a3
      operationId: listSensoryThresholds
      summary: Lista el historial de umbrales sensoriales
      tags:
        - Maestros
      parameters:
        - name: piscoTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Historial de umbrales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensoryThresholdListResponse'
    post:
      security: *a3
      operationId: createSensoryThresholdVersion
      summary: Crea un umbral y cierra la versión anterior
      tags:
        - Maestros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSensoryThresholdRequest'
      responses:
        '201':
          description: Umbral creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensoryThresholdResponse'
        '409':
          description: Intervalo de vigencia superpuesto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/sensory-thresholds/effective:
    get:
      security: *a3
      operationId: resolveEffectiveSensoryThreshold
      summary: Resuelve el umbral sensorial por tipo y fecha
      tags:
        - Maestros
      parameters:
        - name: piscoTypeId
          in: query
          schema:
            type: string
            format: uuid
        - *a4
        - *a5
      responses:
        '200':
          description: Umbral aplicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensoryThresholdResponse'
        '422':
          description: No existe un umbral confirmado aplicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/varieties:
    get:
      security: &a6
        - bearerAuth: []
      tags: &a7
        - Maestros
      operationId: listGrapeVariety
      summary: Lista variedad de uva
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Catálogo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrapeVarietyListResponse'
    post:
      security: *a6
      tags: *a7
      operationId: createGrapeVariety
      summary: Crea variedad de uva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrapeVarietyRequest'
      responses:
        '201':
          description: Elemento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrapeVarietyResponse'
        '403':
          description: Requiere ADMIN o JEFE_CALIDAD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/varieties/{id}:
    patch:
      security: *a6
      tags: *a7
      operationId: updateGrapeVariety
      summary: Actualiza o desactiva variedad de uva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGrapeVarietyRequest'
      responses:
        '200':
          description: Elemento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrapeVarietyResponse'
        '404':
          description: Elemento inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/pisco-types:
    get:
      security: *a6
      tags: *a7
      operationId: listPiscoType
      summary: Lista tipo de pisco
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Catálogo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PiscoTypeListResponse'
    post:
      security: *a6
      tags: *a7
      operationId: createPiscoType
      summary: Crea tipo de pisco
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePiscoTypeRequest'
      responses:
        '201':
          description: Elemento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PiscoTypeResponse'
        '403':
          description: Requiere ADMIN o JEFE_CALIDAD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/pisco-types/{id}:
    patch:
      security: *a6
      tags: *a7
      operationId: updatePiscoType
      summary: Actualiza o desactiva tipo de pisco
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePiscoTypeRequest'
      responses:
        '200':
          description: Elemento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PiscoTypeResponse'
        '404':
          description: Elemento inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/stages:
    get:
      security: *a6
      tags: *a7
      operationId: listProcessStage
      summary: Lista etapa del proceso
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Catálogo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStageListResponse'
    post:
      security: *a6
      tags: *a7
      operationId: createProcessStage
      summary: Crea etapa del proceso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessStageRequest'
      responses:
        '201':
          description: Elemento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStageResponse'
        '403':
          description: Requiere ADMIN o JEFE_CALIDAD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/stages/{id}:
    patch:
      security: *a6
      tags: *a7
      operationId: updateProcessStage
      summary: Actualiza o desactiva etapa del proceso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessStageRequest'
      responses:
        '200':
          description: Elemento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessStageResponse'
        '404':
          description: Elemento inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Código u orden duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /masters/equipment:
    get:
      security: *a6
      tags: *a7
      operationId: listEquipment
      summary: Lista instrumento de laboratorio
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Catálogo disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentListResponse'
    post:
      security: *a6
      tags: *a7
      operationId: createEquipment
      summary: Crea instrumento de laboratorio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentRequest'
      responses:
        '201':
          description: Elemento creado.
          content:
            application/json:
