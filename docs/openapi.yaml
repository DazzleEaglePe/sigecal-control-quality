components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: sigecal_refresh
  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
            message:
              type: string
              minLength: 1
            details:
              type: array
              items: {}
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - success
        - error
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            status:
              type: string
              const: ok
            database:
              type: string
              const: connected
            timestamp:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required:
            - status
            - database
            - timestamp
          additionalProperties: false
        meta:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - page
            - pageSize
            - total
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    DatabaseUnavailableErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              const: DATABASE_UNAVAILABLE
            message:
              type: string
              const: El servicio no está disponible temporalmente.
            details:
              type: array
              items: {}
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - success
        - error
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
