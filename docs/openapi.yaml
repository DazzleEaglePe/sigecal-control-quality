components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: sigecal_refresh
  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]*$
            message:
              type: string
              minLength: 1
            details:
              type: array
              items: {}
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - success
        - error
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            status:
              type: string
              const: ok
            database:
              type: string
              const: connected
            timestamp:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          required:
            - status
            - database
            - timestamp
          additionalProperties: false
        meta:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - page
            - pageSize
            - total
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
    DatabaseUnavailableErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
              const: DATABASE_UNAVAILABLE
            message:
              type: string
              const: El servicio no está disponible temporalmente.
            details:
              type: array
              items: {}
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - success
        - error
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            accessToken:
              type: string
              minLength: 1
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                firstName:
                  type: string
                  minLength: 1
                lastName:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                role:
                  type: string
                  enum:
                    - ADMIN
                    - JEFE_CALIDAD
                    - ANALISTA
                    - OPERARIO
                mustChangePassword:
                  type: boolean
                permissions:
                  type: array
                  items:
                    type: string
                    enum:
                      - USERS_MANAGE
                      - AREAS_MANAGE
                      - MASTERS_MANAGE
                      - BATCHES_OPERATE
                      - BATCHES_CLOSE
                      - BATCHES_REJECT
                      - INSPECTIONS_SCHEDULE
                      - RESULTS_RECORD
                      - SENSORY_RECORD
                      - NONCONFORMITIES_RECORD
                      - ACTIONS_OPERATE
                      - NONCONFORMITIES_CLOSE
                      - DASHBOARD_VIEW
                      - REPORTS_EXPORT
                      - AUDIT_VIEW
              required:
                - id
                - firstName
                - lastName
                - email
                - role
                - mustChangePassword
                - permissions
              additionalProperties: false
          required:
            - accessToken
            - user
          additionalProperties: false
        meta:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - page
            - pageSize
            - total
          additionalProperties: false
      required:
        - success
        - data
      additionalProperties: false
